<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1018">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e1018'/><circle cx='22' cy='22' r='4.5' fill='%23ef5350'/></svg>">

  <!-- Set the theme before first paint to avoid a flash -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('panel:theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.classList.add(t);
    })();
  </script>

  <link rel="preload" href="fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="content">
    <nav class="top" aria-label="Główna">
      <div class="left-nav">
        <a href="#/" class="logo" id="logo" data-route="panel">Panel</a>
        <a class="sync-badge" id="sync-badge" href="#/ustawienia" data-state="local" title="Dane zapisane tylko w tej przeglądarce">
          <span class="led"></span><span class="txt">lokalnie</span>
        </a>
      </div>
      <div class="right-nav">
        <a href="#/zadania" data-route="zadania">Zadania</a>
        <a href="#/projekty" data-route="projekty">Projekty</a>
        <a href="#/pomysly" data-route="pomysly">Pomysły</a>
        <a href="#/dziennik" data-route="dziennik">Dziennik</a>
        <button class="icon-btn" id="search-button" type="button" aria-label="Szukaj" aria-haspopup="dialog" aria-controls="search-dialog" title="Szukaj (⌘K / Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Przełącz motyw" aria-pressed="false" title="Przełącz motyw (t)">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </nav>

    <main id="view" tabindex="-1"></main>

    <footer class="site">
      <span id="footer-left"></span>
      <span><kbd>n</kbd> nowe zadanie · <kbd>⌘K</kbd> szukaj · <kbd>t</kbd> motyw · <kbd>g</kbd> + <kbd>p</kbd><kbd>z</kbd><kbd>r</kbd><kbd>i</kbd><kbd>d</kbd> przejdź do</span>
    </footer>
  </div>

  <dialog id="task-dialog" aria-labelledby="task-dialog-title"></dialog>
  <dialog id="search-dialog" class="search-modal" aria-labelledby="search-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"><span class="msg"></span><button type="button" hidden>cofnij</button></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
