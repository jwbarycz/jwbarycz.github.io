<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel</title>
  <meta name="theme-color" content="#0e1018">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e1018'/><circle cx='22' cy='22' r='4.5' fill='%23ef5350'/></svg>">

  <!-- Motyw ustawiony przed renderem, żeby nie mrugało -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('panel:theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.classList.add(t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="content">
    <nav class="top" aria-label="Główna">
      <div class="left-nav">
        <a href="#/" class="logo" id="logo" data-route="panel">Panel</a>
        <a class="sync-badge" id="sync-badge" href="#/ustawienia" data-state="local" title="Dane zapisane tylko w tej przeglądarce">
          <span class="led"></span><span class="txt">lokalnie</span>
        </a>
      </div>
      <div class="right-nav">
        <a href="#/zadania" data-route="zadania">Zadania</a>
        <a href="#/projekty" data-route="projekty">Projekty</a>
        <a href="#/biblioteka" data-route="biblioteka">Biblioteka</a>
        <a href="#/dziennik" data-route="dziennik">Dziennik</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Przełącz motyw" title="Przełącz motyw (t)">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
      </div>
    </nav>

    <main id="view" tabindex="-1"></main>

    <footer class="site">
      <span id="footer-left"></span>
      <span><kbd>n</kbd> nowe zadanie · <kbd>t</kbd> motyw · <kbd>g</kbd> + <kbd>p</kbd><kbd>z</kbd><kbd>r</kbd><kbd>b</kbd><kbd>d</kbd> przejdź do</span>
    </footer>
  </div>

  <dialog id="task-dialog" aria-labelledby="task-dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"><span class="msg"></span><button type="button" hidden>cofnij</button></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
